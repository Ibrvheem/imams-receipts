<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Offline · IBL Receipts</title>
  <!-- Shown by the service worker when there is no network. Self-contained:
       no scripts or external files, so it always renders. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0a; color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
    .icon { width: 56px; height: 56px; border-radius: 8px; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    p { margin: 4px 0 0; max-width: 300px; font-size: 14px; line-height: 1.6; color: #a1a1a1; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
      padding: 0 20px; border-radius: 8px; background: #e5e5e5; color: #171717;
      font-size: 14px; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/icons/icon-192.png" alt="" />
    <div>
      <h1>You're offline</h1>
      <p>Receipts are saved online, so the app needs internet. Check your data or Wi-Fi and try again.</p>
    </div>
    <a href="">Try again</a>
  </main>
</body>
</html>
